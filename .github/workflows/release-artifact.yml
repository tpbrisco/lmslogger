name: create release artifact
on: push

jobs:
  create_tar:
    name: create tar from repo
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7

      - name: create source archive
        run: git archive --verbose --format=tgz --output ${{ var.PKG_NAME }}-${{ github.ref_name }}.tgz HEAD .

      - name: upload tar archive as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ var.PKG_NAME }}-${{ github.ref_name }}.tgz
          path: ${{ var.PKG_NAME }}-${{ github.ref_name }}.tgz

