name: create release artifact
on: push

jobs:
  create_tar:
    name: create tar from repo
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7

      - name: create source archive
        run: git archive --verbose --format=tgz --output ${{ vars.PKG_NAME }}-${{ github.ref_name }}.tgz HEAD .

      - name: upload tar archive as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.PKG_NAME }}-${{ github.ref_name }}.tgz
          path: ${{ vars.PKG_NAME }}-${{ github.ref_name }}.tgz

  create_rpm:
    name: create rpm from tar artifact
    runs-on: ubuntu-latest
    needs: create_tar

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: run rpmbuild on artifact
        id: rpm
        uses: naveenrajm7/rpmbuild@master
        with:
          spec_file: ${{ vars.PKG_NAME }}.spec

      - name: Upload rpm as artifact
        uses: action/upload-artifact@v7
        with:
          name: ${{ vars.PKG_NAME }}-${{ github.ref_name}}-1.${{ vars.DIST }}.${{ vars.ARCH }}.rpm
          path: rpmbuild/RPMS/${{ vars.ARCH }}/*.rpm
