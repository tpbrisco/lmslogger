name: create release artifact
on: workflow_dispatch

jobs:
  create_rpm:
    name: create tar from repo
    runs-on: self-hosted
    
    steps:
      - uses: actions/checkout@v7

      - name: create source archive
        run: git archive --verbose --format=tgz --output ${{ vars.PKG_NAME }}-${{ github.ref_name }}.tgz HEAD .

      - name: build rpm
        run: |
          rpmdev-setuptree
          export RUNDIR=${PWD}
          cd ~/rpmbuild
          cp ${RUNDIR}/lmslogger-main.tgz SOURCES/
          cp ${RUNDIR}/lmslogger.spec SPECS/
          rpmbuild -ba SPECS/lmslogger.spec

      - name: Upload rpm as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.PKG_NAME }}-${{ github.ref_name}}-1.${{ vars.DIST }}.${{ vars.ARCH }}.rpm
          path: rpmbuild/RPMS/${{ vars.ARCH }}/*.rpm


