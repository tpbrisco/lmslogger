name: create release artifact
on: workflow_dispatch

permissions:
  contents: write
  security-events: write
  actions: read

jobs:
  create_version:
    name: create tags, scans for repo
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          vuln-type: 'library'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: put in security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: bump version and tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GHCR_TOKEN }}
          create_annotated_tag: true

      - name: debug tag_version outputs
        run: |
          printf 'github.ref_name=%s\n' '${{ github.ref_name }}'
          printf 'release_type=%s\n' '${{ steps.tag_version.outputs.release_type }}'
          printf 'version=%s\n' '${{ steps.tag_version.outputs.new_version }}'

  create_rpm:
    name: create rpm from repo
    runs-on: self-hosted
    needs: create_version
    
    steps:
      - name: create source archive
        run: |
          export VERSION=$(grep ^Version: lmslogger.spec | sed -e 's/Version: //')
          echo "Version is ${VERSION}, pwd is ${PWD}"
          git archive --verbose --format=tgz \
          --prefix="lmslogger-${VERSION}/" \
          --output ${{ vars.PKG_NAME }}-${{ github.ref_name }}.tgz HEAD .

      - name: build rpm
        run: |
          export RUNDIR=${PWD}
          export VERSION=$(grep ^Version: lmslogger.spec | sed -e 's/Version: //')
          rpmdev-setuptree
          cd ~/rpmbuild
          ls ${RUNDIR}
          cp ${RUNDIR}/lmslogger-main.tgz SOURCES/lmslogger-${VERSION}.tgz
          cp ${RUNDIR}/lmslogger.spec SPECS/
          rpmbuild -ba SPECS/lmslogger.spec

      - name: upload release asset
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          tag_name: ${{ needs.create_version.outputs.new_tag }}
          files: ~/rpmbuild/RPMS/${{ vars.ARCH }}/*.rpm

      - name: clean up
        run: |
          rm -rf ~/rpmbuild
          rm -rf ./* || true
          rm -rf ./.??* || true
