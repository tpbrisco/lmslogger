name: RPM Build
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: create source archive
      run: git archive --verbose --format=tgz --output ${{ vars.PKG_NAME }}-${{ github.ref_name }}.tar.gz HEAD .
    - name: upload tar archive as artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ vars.PKG_NAME }}-${{ github.ref_name }}.tar.gz
        path: ${{ vars.PKG_NAME }}-${{ github.ref_name }}.tar.gz

