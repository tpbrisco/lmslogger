name: Manual test run

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  test:
    name: Run pytest
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pytest mypy pytest-cov
          export PATH="${PATH}:$HOME/.local/bin"
          echo -n "mypy"; which mypy; echo -n "pytest"; which pytest; echo -n "pytest-cov"; which pytest-cov

      - name: Run tests with coverage
        run: PYTHONPATH=src python3 -m pytest --cov=src --cov-report=json:coverage.json -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: error
          retention-days: 30

      - name: Run type checks
        run: |
          export PATH="${PATH}:$HOME/.local/bin"
          PYTHONPATH=src mypy src
