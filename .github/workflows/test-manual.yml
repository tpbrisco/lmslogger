name: Manual test run

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  test:
    name: Run pytest
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          # Prefer editable install with PEP-621 dev extras; fall back to requirements-dev.txt
          python3 -m pip install -e .[dev] || python3 -m pip install -r requirements-dev.txt
          # Ensure test tooling is available
          python3 -m pip install pytest pytest-cov mypy

      - name: Run tests with coverage
        run: |
          PYTHONPATH=src python3 -m pytest --cov=src --cov-report=json:coverage.json -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: error
          retention-days: 30

      - name: Run type checks
        run: |
          PYTHONPATH=src python3 -m mypy src
